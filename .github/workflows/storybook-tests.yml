name: Storybook Tests

# Called by pr.yml (D90): one job per base, `pnpm test storybook-tests
# --base <b>` (every story and play in headless Chromium), its test/.out/
# record uploaded as test-out-storybook-tests-<base>. The check context reads
# `Storybook Tests / Storybook Tests (<base>)`.
# The skip input (the PR head is the version bump commit, D35) skips every
# step, not the job: a job-level if: is read before the matrix expands, so
# GitHub would report one unexpanded skipped job instead of the leg contexts
# (actions/runner#952). Each leg runs no step and reports success.
on:
  workflow_call:
    inputs:
      skip:
        description: Skip every step (the PR head is the version bump commit, D35)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  storybook-tests:
    name: Storybook Tests (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.skip }}
      - uses: pnpm/action-setup@v6
        if: ${{ !inputs.skip }}
      - uses: actions/setup-node@v7
        if: ${{ !inputs.skip }}
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.skip }}
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
        if: ${{ !inputs.skip }}
      - run: pnpm test storybook-tests --ci --base ${{ matrix.base }}
        if: ${{ !inputs.skip }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !inputs.skip }}
        with:
          name: test-out-storybook-tests-${{ matrix.base }}
          path: test/.out/
          include-hidden-files: true
          overwrite: true
