name: pr

# Every check of a pull request: nineteen test jobs, each the setup steps
# plus `pnpm test <name> --ci` (test/run.mjs) and its test/.out/ records
# uploaded as the artifact test-out-<job>; PR Summary (D87) rewrites the one
# sticky comment from those records; Prepare Release, on the release PR only
# (dev into master), commits `chore: version <v>` once every job is green.
# A label change runs Validate PR and PR Summary alone (the other jobs skip
# those events). workflow_dispatch runs every test job on the chosen branch
# (Validate PR and Prepare Release skip without a PR); with
# installation-e2e-only it runs the seven Installation E2E jobs with
# --no-diff, whose artifacts carry the captures (the reference refresh path,
# D86).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      installation-e2e-only:
        description: Run only the seven Installation E2E jobs, with --no-diff, and upload the captures
        type: boolean
        default: false

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}-${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && 'labels' || 'checks' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (${{ matrix.base }})
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !(github.event_name == 'workflow_dispatch' && inputs.installation-e2e-only) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test typecheck --ci --base ${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-typecheck-${{ matrix.base }}
          path: test/.out/
          include-hidden-files: true

  lint:
    name: Lint
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !(github.event_name == 'workflow_dispatch' && inputs.installation-e2e-only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test lint --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-lint
          path: test/.out/
          include-hidden-files: true

  storybook-tests:
    name: Storybook Tests (${{ matrix.base }})
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !(github.event_name == 'workflow_dispatch' && inputs.installation-e2e-only) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm test storybook-tests --ci --base ${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-storybook-tests-${{ matrix.base }}
          path: test/.out/
          include-hidden-files: true

  # The docs app is built from this checkout and served by `next start` on
  # 5320; clusters a to e run against it.
  docs-e2e:
    name: Docs E2E Tests (${{ matrix.base }})
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !(github.event_name == 'workflow_dispatch' && inputs.installation-e2e-only) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm test docs-e2e --ci --base ${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-docs-e2e-${{ matrix.base }}
          path: test/.out/
          include-hidden-files: true

  # bases-identical, icon-maps, tailwind-classes, registry-valid and the
  # tool unit tests (node --test "tools/**/*.test.mjs").
  validate-repo:
    name: Validate Repo
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !(github.event_name == 'workflow_dispatch' && inputs.installation-e2e-only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test validate-repo --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-validate-repo
          path: test/.out/
          include-hidden-files: true

  # A fresh app per scenario installs the table from the dev registry built
  # from this checkout (served on 5310), typechecks and builds; the Next
  # scenarios then run the browser checks and the capture diff on 5341.
  installation-e2e:
    name: Installation E2E (${{ matrix.scenario }})
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, existing, base, aria, nextjs-base, nextjs-radix, nextjs-aria]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
        if: startsWith(matrix.scenario, 'nextjs-')
      - run: pnpm test installation-e2e --ci --scenario ${{ matrix.scenario }} ${{ github.event_name == 'workflow_dispatch' && inputs.installation-e2e-only && '--no-diff' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-installation-e2e-${{ matrix.scenario }}
          path: test/.out/
          include-hidden-files: true

  # Exactly one `release:` label on a PR into master (from dev only); on
  # another base a label only when the PR changes shipped files; the
  # version bump dry run. The labels are read live.
  validate-pr:
    name: Validate PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test validate-pr --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-validate-pr
          path: test/.out/
          include-hidden-files: true

  # One sticky comment per PR (D87), from every test-out-* artifact; on a
  # workflow_dispatch the comment goes to the step summary.
  pr-summary:
    name: PR Summary
    if: always()
    needs: [typecheck, lint, storybook-tests, docs-e2e, validate-repo, installation-e2e, validate-pr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: test-out-*
          merge-multiple: true
          path: test/.out/
      - run: node tools/release/pr-summary.mjs

  # The last job, on the release PR only (dev into master): once every job
  # is green it bumps the version with the PR's `release:` level and commits
  # `chore: version <v>` to dev with RELEASE_BOT_TOKEN, a token whose push
  # triggers this workflow again (a push with github.token would not). On
  # that rerun Validate PR passes the bumped head and this job stops at
  # "already bumped". A red or skipped need skips it.
  prepare-release:
    name: Prepare Release
    needs: [pr-summary, typecheck, lint, storybook-tests, docs-e2e, validate-repo, installation-e2e, validate-pr]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'dev' && !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
    steps:
      - name: Check the RELEASE_BOT_TOKEN secret
        run: |
          if [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo "::error::secret RELEASE_BOT_TOKEN is missing; the owner creates it (Settings, Secrets and variables, Actions): a fine-grained token with contents: write on this repository"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump the version and commit it to the PR head
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name | select(startswith("release:"))')
          count=$(printf '%s' "$labels" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::more than one release: label: ${labels//$'\n'/ }"
            exit 1
          fi
          if [ "$count" -eq 0 ] || [ "$labels" = release:skip ]; then
            echo "no release, no bump"
            echo "No release, no bump (${labels:-no release: label})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          level=${labels#release:}
          base=$(git show origin/master:packages/shadcn-table/package.json | jq -r .version)
          status=0
          node tools/release/prepare-release.mjs --check --base-version "$base" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "already bumped"
            echo "Already bumped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$status" -eq 2 ] || exit "$status"
          next=$(node tools/release/prepare-release.mjs --level "$level" --base-version "$base")
          git add -- CHANGELOG.md packages/shadcn-table/package.json apps/shadcn-table-docs/package.json
          git -c 'user.name=github-actions[bot]' \
            -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "chore: version $next"
          git push origin "HEAD:$GITHUB_HEAD_REF"
          echo "Committed chore: version $next to $GITHUB_HEAD_REF."
          echo "Committed \`chore: version $next\` to $GITHUB_HEAD_REF." >> "$GITHUB_STEP_SUMMARY"
