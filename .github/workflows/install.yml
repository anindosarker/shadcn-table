name: install

# The install matrix, reusable: pr.yml runs it against the GitHub address at
# the pull request's merge SHA, release.yml against the public URL of the
# tagged production deployment. One definition, so the two cannot drift.
on:
  workflow_call:
    inputs:
      source:
        description: >-
          Template of the main item's address. `<item>` is replaced by the
          scenario's committed item name (shadcn-table, shadcn-table-base or
          shadcn-table-aria), `<base>` by its edition (radix, base or aria). pr.yml passes
          `anindosarker/shadcn-table/<item>#<sha>`, release.yml passes
          `https://www.shadcn-table.com/r/<base>/shadcn-table.json`.
        type: string
        required: true

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.scenario }} app)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ inputs.source }}
      # The locale and example steps below pin the checkout's commit
      # whatever the source is: the locale comes from the dev registry built
      # here and the scenario's edition of example-basic from the GitHub
      # address at this SHA.
      REF: ${{ github.sha }}
      # fresh, existing and nextjs run on the Radix base and install the
      # shadcn-table item; base scaffolds on Base UI and installs the
      # shadcn-table-base item (its locale item is shadcn-table-base-locale-de,
      # its example item example-basic-base), aria scaffolds on React Aria
      # and installs shadcn-table-aria (example-basic-aria).
      BASE: ${{ (matrix.scenario == 'base' || matrix.scenario == 'aria') && matrix.scenario || 'radix' }}
      ITEM: ${{ (matrix.scenario == 'base' || matrix.scenario == 'aria') && format('shadcn-table-{0}', matrix.scenario) || 'shadcn-table' }}
      EXAMPLE_ITEM: ${{ (matrix.scenario == 'base' || matrix.scenario == 'aria') && format('example-basic-{0}', matrix.scenario) || 'example-basic' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, existing, base, aria, nextjs]
    steps:
      # The repo is checked out into repo/ only for the dev registry (locale
      # step below); the consumer app lives in ${{ runner.temp }}/app so no
      # workspace file leaks into it.
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - name: Scaffold a Vite app on the scenario's base
        if: matrix.scenario != 'nextjs'
        run: pnpm dlx shadcn@latest init --template vite --base "$BASE" --preset nova --name app --yes
        working-directory: ${{ runner.temp }}
      - name: Scaffold a Next.js app on the Radix base
        if: matrix.scenario == 'nextjs'
        run: pnpm dlx shadcn@latest init --template next --base radix --preset nova --name app --yes
        working-directory: ${{ runner.temp }}
      - name: Pre-install TanStack packages (existing app only)
        if: matrix.scenario == 'existing'
        run: pnpm add @tanstack/react-table@9.3.1 @tanstack/react-store@0.11.2 @tanstack/react-query
        working-directory: ${{ runner.temp }}/app
      # The item address comes from the `source` template: in CI the GitHub
      # address at this SHA, in a release the item's public URL on the site.
      - name: Add the library from the source
        run: |
          set -o pipefail
          address="${SOURCE//'<base>'/$BASE}"
          address="${address//'<item>'/$ITEM}"
          echo "installing $address"
          pnpm dlx shadcn@latest add "$address" --yes 2>&1 | tee shadcn-add.log
        working-directory: ${{ runner.temp }}/app
      - name: Mount a table, type-check and build (Vite)
        if: matrix.scenario != 'nextjs'
        run: |
          cat > src/App.tsx <<'TSX'
          import { ShadcnTable } from '@/components/ui/shadcn-table';

          const columns = [
            { accessorKey: 'name', header: 'Name' },
            { accessorKey: 'age', header: 'Age' },
          ];
          const data = [
            { name: 'Ada', age: 36 },
            { name: 'Linus', age: 54 },
          ];

          export default function App() {
            return <ShadcnTable columns={columns} data={data} />;
          }
          TSX
          pnpm exec tsc --noEmit -p tsconfig.app.json
          pnpm exec vite build
        working-directory: ${{ runner.temp }}/app
      # The table runs hooks, so it mounts in a client component; the server
      # component page imports that component. next build type-checks and
      # compiles both.
      - name: Mount a table in a client component and run next build
        if: matrix.scenario == 'nextjs'
        run: |
          cat > components/table-demo.tsx <<'TSX'
          'use client';

          import { ShadcnTable } from '@/components/ui/shadcn-table';

          const columns = [
            { accessorKey: 'name', header: 'Name' },
            { accessorKey: 'age', header: 'Age' },
          ];
          const data = [
            { name: 'Ada', age: 36 },
            { name: 'Linus', age: 54 },
          ];

          export function TableDemo() {
            return <ShadcnTable columns={columns} data={data} />;
          }
          TSX
          cat > app/page.tsx <<'TSX'
          import { TableDemo } from '@/components/table-demo';

          export default function Page() {
            return (
              <main className="p-6">
                <TableDemo />
              </main>
            );
          }
          TSX
          pnpm exec next build
        working-directory: ${{ runner.temp }}/app
      # A locale item depends on the unpinned GitHub address of its main item,
      # which the CLI resolves on the default branch, not at this SHA. The dev
      # registry built from the checkout pins that dependency to this SHA's
      # library, so the locale is installed through it.
      - name: Build and serve the dev registry from this checkout
        if: matrix.scenario != 'nextjs'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter shadcn-table registry:dev
          (pnpm exec serve packages/shadcn-table/.dev -l 5310 > serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5310/r/$ITEM-locale-de.json" > /dev/null && break
            sleep 1
          done
          curl -sf "http://localhost:5310/r/$ITEM-locale-de.json" > /dev/null
        working-directory: repo
      # Example items pin the library to gitConfig.branch, so this add re-fetches
      # the library from that branch; --overwrite lets it replace the files
      # without a prompt. The library at this SHA was proven by the steps above.
      - name: Add a locale and the edition's example-basic, mount them, type-check and build
        if: matrix.scenario != 'nextjs'
        run: |
          set -o pipefail
          pnpm dlx shadcn@latest add "http://localhost:5310/r/$ITEM-locale-de.json" --yes --overwrite 2>&1 | tee -a shadcn-add.log
          pnpm dlx shadcn@latest add "anindosarker/shadcn-table/$EXAMPLE_ITEM#$REF" --yes --overwrite 2>&1 | tee -a shadcn-add.log
          cat > src/App.tsx <<'TSX'
          import Example from '@/components/examples/basic/basic';
          import { ShadcnTable } from '@/components/ui/shadcn-table';
          import { ST_Localization_DE } from '@/components/ui/shadcn-table/shared/locales/de';

          const columns = [{ accessorKey: 'name', header: 'Name' }];
          const data = [{ name: 'Ada' }];

          export default function App() {
            return (
              <>
                <Example />
                <ShadcnTable columns={columns} data={data} localization={ST_Localization_DE} />
              </>
            );
          }
          TSX
          pnpm exec tsc --noEmit -p tsconfig.app.json
          pnpm exec vite build
        working-directory: ${{ runner.temp }}/app
      - name: One @tanstack/react-table entry in package.json, installed version 9.x
        run: |
          count=$(node -e 'const p=require("./package.json");const all={...p.dependencies,...p.devDependencies};console.log(Object.keys(all).filter(k=>k==="@tanstack/react-table").length)')
          node -e 'const p=require("./package.json");console.log("@tanstack/react-table", p.dependencies["@tanstack/react-table"])'
          test "$count" = "1"
          installed=$(node -e 'console.log(require("@tanstack/react-table/package.json").version)')
          echo "installed @tanstack/react-table $installed"
          case "$installed" in 9.*) ;; *) echo "expected a 9.x install"; exit 1;; esac
        working-directory: ${{ runner.temp }}/app
      - name: No radix-ui on the Base UI base
        if: matrix.scenario == 'base'
        run: |
          node -e 'const p=require("./package.json");const all={...p.dependencies,...p.devDependencies};if("radix-ui" in all){console.error("radix-ui installed:",all["radix-ui"]);process.exit(1)};console.log("@base-ui/react", all["@base-ui/react"])'
        working-directory: ${{ runner.temp }}/app
      - name: No radix-ui or @base-ui/react on the React Aria base
        if: matrix.scenario == 'aria'
        run: |
          node -e 'const p=require("./package.json");const all={...p.dependencies,...p.devDependencies};const other=["radix-ui","@base-ui/react"].filter(n=>n in all);if(other.length){console.error("installed:",other.join(", "));process.exit(1)};if(!("react-aria-components" in all)){console.error("react-aria-components missing");process.exit(1)};console.log("react-aria-components", all["react-aria-components"])'
        working-directory: ${{ runner.temp }}/app
      - name: Show package.json and shadcn output
        if: failure()
        run: |
          echo "::group::package.json"; cat package.json; echo "::endgroup::"
          echo "::group::shadcn output"; cat shadcn-add.log 2>/dev/null || true; echo "::endgroup::"
        working-directory: ${{ runner.temp }}/app
