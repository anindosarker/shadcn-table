name: release

# A push to master whose packages/shadcn-table/package.json version has no
# v<version> tag yet (the merged pull request from `pnpm release <version>`)
# creates that tag, verifies production and creates the GitHub release; any
# failed job means no release. A push to master whose version is already
# tagged skips every job. A v* tag pushed by hand runs the same checks and
# release for that tag. On workflow_dispatch, dry_run (the default) skips the
# release job: that run proves the workflow without a tag.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version production must serve (the content of /version.txt, no v prefix)
        type: string
        required: true
      dry_run:
        description: Run every check and skip `gh release create`
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  SITE: https://www.shadcn-table.com
  LIB_PACKAGE: packages/shadcn-table/package.json

jobs:
  wait-for-production:
    name: wait for production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version (dispatch input, tag name without the v, or the package version on master) and tag it
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          skip=false
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              v*) version="${GITHUB_REF_NAME#v}" ;;
              *) echo "::error::$GITHUB_REF_NAME is not a v* tag"; exit 1 ;;
            esac
          else
            version=$(node -p "require('./$LIB_PACKAGE').version")
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "v$version is already tagged; nothing to release"
              skip=true
            else
              git tag "v$version" "$GITHUB_SHA"
              git push origin "refs/tags/v$version"
              echo "tagged v$version at $GITHUB_SHA"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = true ] || echo "verifying $version"
      # Vercel builds master on the version commit, so the deployment that
      # serves the version is the tagged commit. 20 minutes covers a docs
      # build plus propagation.
      - name: Poll ${{ env.SITE }}/version.txt every 30 s, 20 min timeout
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deadline=$((SECONDS + 1200))
          while :; do
            served=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$served" = "$VERSION" ]; then
              echo "production serves $VERSION"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::production serves '${served:-nothing}' after 20 min, expected $VERSION"
              exit 1
            fi
            echo "production serves '${served:-nothing}', waiting for $VERSION"
            sleep 30
          done

  smoke:
    name: smoke (registry, Storybook, SKILL.md, docs pages)
    needs: wait-for-production
    # A skipped smoke skips install and release with it.
    if: needs.wait-for-production.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/release/smoke.mjs
      # The page checks need Playwright from packages/shadcn-table.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm --filter shadcn-table-docs exec node scripts/check-pages.mjs --base "$SITE"

  install:
    needs: smoke
    uses: ./.github/workflows/install.yml
    with:
      source: https://www.shadcn-table.com/r/<base>/shadcn-table.json

  release:
    name: gh release create
    needs: [wait-for-production, install]
    # A dispatch with dry_run proves the checks without releasing; on a push
    # inputs.dry_run is empty, so the release runs.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.wait-for-production.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release/notes.mjs "$VERSION" > notes.md
      # --verify-tag refuses to create the tag itself: the release is for the
      # tag this workflow or a hand push created. A prerelease version (one
      # with a hyphen) is marked as such instead of becoming the latest release.
      - run: |
          case "$VERSION" in
            *-*) flag=--prerelease ;;
            *) flag=--latest ;;
          esac
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md "$flag"
