name: Release
# run-name cannot read files, so a push run is named `Release` and Check
# Release writes the version it read from packages/shadcn-table/package.json
# to the step summary; a dispatch is named after its version input (D90).
run-name: "${{ inputs.version && format('Release {0}', inputs.version) || 'Release' }}"

# Runs on every push to master and does one of two things, chosen by Check
# Release (tools/release/check-release.mjs):
#   release  `## Unreleased` is gone and v<package version> is untagged (the
#            release PR merged with its `chore: version <v>` commit from the
#            Prepare Release job of pr.yml): Verify Deployment waits until
#            www and storybook serve the version and tags this commit,
#            Validate Production checks the live site, Publish Release
#            creates the GitHub release and comments "Released in v<v>" on
#            the PRs it shipped.
#   none     anything else (the version is tagged, or `## Unreleased` has
#            lines: merged without the bump, a warning): every job skips.
# workflow_dispatch runs the release path for `version` (default: the package
# version) without tagging, to re-run after a failed late step; dry_run (the
# default) also skips Publish Release.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: The version production must serve (the content of /version.txt, no v prefix); empty means the package version
        type: string
        required: false
      dry_run:
        description: Run every check and skip Publish Release (gh release create and the PR comments)
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  check-release:
    name: Check Release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      version: ${{ steps.check.outputs.version }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reads EVENT, INPUT_VERSION and GITHUB_SHA, runs next-version.mjs,
      # asks git for the tag, and writes mode and version to $GITHUB_OUTPUT.
      - name: Read the changelog, the package version and its tag
        id: check
        run: node tools/release/check-release.mjs

  # Vercel builds master on the version commit; both sites serve the version
  # once that deployment is live. The poll comes before the tag.
  verify-deployment:
    name: Verify Deployment
    needs: check-release
    if: needs.check-release.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poll www and storybook /version.txt every 30 s, 20 min timeout
        run: node tools/release/verify-deployment.mjs --version "$VERSION"
      # Only a push tags: a dispatch re-runs the checks for a version that is
      # tagged already, or proves the workflow without a tag (dry_run).
      - name: Tag this commit as v${{ needs.check-release.outputs.version }}
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged"
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
            echo "tagged v$VERSION at $GITHUB_SHA"
          fi

  validate-production:
    name: Validate Production
    needs: [check-release, verify-deployment]
    if: needs.check-release.outputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm test validate-production --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-validate-production
          path: test/.out/
          include-hidden-files: true
          overwrite: true

  publish-release:
    name: Publish Release
    needs: [check-release, validate-production]
    # A dispatch with dry_run proves the checks without releasing; on a push
    # inputs.dry_run is empty, so the release runs.
    if: ${{ needs.check-release.outputs.mode == 'release' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-release.outputs.version }}
    steps:
      # Full history and tags: comment.mjs finds the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/release/publish-release.mjs --version "$VERSION"
