name: release

# Runs on every push to master and does one of two things, chosen by the
# decide job (scripts/release/decide.mjs):
#   release  `## Unreleased` is gone and v<package version> is untagged (the
#            release PR merged with its `chore: version <v>` commit from the
#            `version bump (release:prepare)` job of pr.yml): tags this
#            commit, waits for production, smokes the site, installs the
#            table per base, creates the GitHub release and comments
#            "Released in v<v>" on the PRs it shipped.
#   none     anything else (the version is tagged, or `## Unreleased` has
#            lines: merged without the bump, a warning): every job skips.
# workflow_dispatch runs the release path for `version` (default: the package
# version) without tagging, to re-run after a failed late step; dry_run (the
# default) also skips the GitHub release and the comments.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: The version production must serve (the content of /version.txt, no v prefix); empty means the package version
        type: string
        required: false
      dry_run:
        description: Run every check and skip `gh release create` and the PR comments
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  SITE: https://www.shadcn-table.com

jobs:
  decide:
    name: decide (release or nothing)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/release/decide.mjs reads EVENT, INPUT_VERSION and GITHUB_SHA,
      # runs next-version.mjs, asks git for the tag, and writes mode and
      # version to $GITHUB_OUTPUT.
      - name: Read the changelog, the package version and its tag
        id: decide
        run: node scripts/release/decide.mjs

  wait-for-production:
    name: wait for production
    needs: decide
    if: needs.decide.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Only a push tags: a dispatch re-runs the checks for a version that is
      # tagged already, or proves the workflow without a tag (dry_run).
      - name: Tag this commit as v${{ needs.decide.outputs.version }}
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged"
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
            echo "tagged v$VERSION at $GITHUB_SHA"
          fi
      # Vercel builds master on the version commit, so the deployment that
      # serves the version is the tagged commit. 20 minutes covers a docs
      # build plus propagation.
      - name: Poll ${{ env.SITE }}/version.txt every 30 s, 20 min timeout
        run: |
          deadline=$((SECONDS + 1200))
          while :; do
            served=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$served" = "$VERSION" ]; then
              echo "production serves $VERSION"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::production serves '${served:-nothing}' after 20 min, expected $VERSION"
              exit 1
            fi
            echo "production serves '${served:-nothing}', waiting for $VERSION"
            sleep 30
          done

  smoke:
    name: smoke (registry, Storybook, SKILL.md, docs pages)
    needs: wait-for-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/release/smoke.mjs
      # The page checks need Playwright from packages/shadcn-table.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm --filter shadcn-table-docs exec node scripts/check-pages.mjs --url "$SITE"

  install:
    needs: smoke
    uses: ./.github/workflows/install.yml
    with:
      source: https://www.shadcn-table.com/r/<base>/shadcn-table.json

  release:
    name: gh release create, PR comments
    needs: [decide, install]
    # A dispatch with dry_run proves the checks without releasing; on a push
    # inputs.dry_run is empty, so the release runs.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      # Full history and tags: comment.mjs finds the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release/notes.mjs "$VERSION" > notes.md
      # --verify-tag refuses to create the tag itself: the release is for the
      # tag the wait-for-production job or a hand push created. A prerelease
      # version (one with a hyphen) is marked as such instead of becoming the
      # latest release. A release that exists already (a re-run after the
      # comments failed) is kept.
      - run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION exists"
            exit 0
          fi
          case "$VERSION" in
            *-*) flag=--prerelease ;;
            *) flag=--latest ;;
          esac
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md "$flag"
      - run: node scripts/release/comment.mjs "v$VERSION"
