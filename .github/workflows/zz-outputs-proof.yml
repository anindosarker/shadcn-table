name: zz outputs proof

# Throwaway proof of spec 19 1.6.4 (D38): the consumer prints toJSON(needs);
# all three keys must arrive with call.result failure. Deleted before the
# milestone merges. GitHub dispatches only a workflow known on the default
# branch, so a push to the milestone branch runs it there.
on:
  workflow_dispatch:
  push:
    branches: [v0.9/pr-summary-job-outputs]
    paths: [.github/workflows/zz-outputs-proof*.yml]

permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/zz-outputs-proof-call.yml

  consume:
    needs: [call]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs) }}'
