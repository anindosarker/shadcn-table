name: Installation E2E

# Called by pr.yml (D90): one job per scenario. A fresh app installs the
# table from the dev registry built from this checkout (served on 5310),
# typechecks and builds; the Next scenarios then run the browser checks and
# the capture diff on 5341 (no-diff: capture only, the reference refresh path
# of D86). Its test/.out/ records and captures are uploaded as
# test-out-installation-e2e-<scenario>. The check context reads
# `Installation E2E / Installation E2E (<scenario>)`.
# The skip input (the PR head is the version bump commit, D35) skips every
# step, not the job: a job-level if: is read before the matrix expands, so
# GitHub would report one unexpanded skipped job instead of the leg contexts
# (actions/runner#952). Each leg runs no step and reports success.
on:
  workflow_call:
    inputs:
      no-diff:
        description: Capture without comparing against the committed references
        type: boolean
        default: false
      skip:
        description: Skip every step (the PR head is the version bump commit, D35)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installation-e2e:
    name: Installation E2E (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, existing, base, aria, nextjs-base, nextjs-radix, nextjs-aria]
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.skip }}
      - uses: pnpm/action-setup@v6
        if: ${{ !inputs.skip }}
      - uses: actions/setup-node@v7
        if: ${{ !inputs.skip }}
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.skip }}
      # Chromium for the Next scenarios' browser phase, without --with-deps,
      # from a cache keyed on the Playwright version (D91).
      - name: Read the Playwright version
        id: playwright
        if: ${{ !inputs.skip && startsWith(matrix.scenario, 'nextjs-') }}
        run: echo "version=$(pnpm --filter shadcn-table exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: ${{ !inputs.skip && startsWith(matrix.scenario, 'nextjs-') }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter shadcn-table exec playwright install chromium
        if: ${{ !inputs.skip && startsWith(matrix.scenario, 'nextjs-') }}
      - run: pnpm test installation-e2e --ci --scenario ${{ matrix.scenario }} ${{ inputs.no-diff && '--no-diff' || '' }}
        if: ${{ !inputs.skip }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !inputs.skip }}
        with:
          name: test-out-installation-e2e-${{ matrix.scenario }}
          path: test/.out/
          include-hidden-files: true
          overwrite: true
