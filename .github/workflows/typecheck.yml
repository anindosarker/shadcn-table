name: Typecheck

# Called by pr.yml (D90): one job per base, `pnpm test typecheck --base <b>`
# (the package tsc:<base>; radix also the docs app's types:check), its
# test/.out/ record uploaded as test-out-typecheck-<base>. The check context
# reads `Typecheck / Typecheck (<base>)`.
# The skip input (the PR head is the version bump commit, D35) skips
# every leg; each still reports its check context.
on:
  workflow_call:
    inputs:
      skip:
        description: Skip the job (the PR head is the version bump commit, D35)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (${{ matrix.base }})
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test typecheck --ci --base ${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out-typecheck-${{ matrix.base }}
          path: test/.out/
          include-hidden-files: true
          overwrite: true
