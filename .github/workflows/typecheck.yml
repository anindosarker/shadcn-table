name: Typecheck

# Called by pr.yml (D90): one job per base, `pnpm test typecheck --base <b>`
# (the package tsc:<base>; radix also the docs app's types:check), its
# test/.out/ record handed to PR Summary as the job output <base> (D38),
# exposed as the workflow output of the same name. The check context reads
# `Typecheck / Typecheck (<base>)`.
# The skip input (the PR head is the version bump commit, D35) skips every
# step, not the job: a job-level if: is read before the matrix expands, so
# GitHub would report one unexpanded skipped job instead of the leg contexts
# (actions/runner#952). Each leg runs no step and reports success.
on:
  workflow_call:
    inputs:
      skip:
        description: Skip every step (the PR head is the version bump commit, D35)
        type: boolean
        default: false
    outputs:
      base:
        description: The typecheck record of the base leg (JSON), empty when it wrote none
        value: ${{ jobs.typecheck.outputs.base }}
      radix:
        description: The typecheck record of the radix leg (JSON), empty when it wrote none
        value: ${{ jobs.typecheck.outputs.radix }}
      aria:
        description: The typecheck record of the aria leg (JSON), empty when it wrote none
        value: ${{ jobs.typecheck.outputs.aria }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (${{ matrix.base }})
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.record.outputs.base }}
      radix: ${{ steps.record.outputs.radix }}
      aria: ${{ steps.record.outputs.aria }}
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.skip }}
      - uses: pnpm/action-setup@v6
        if: ${{ !inputs.skip }}
      - uses: actions/setup-node@v7
        if: ${{ !inputs.skip }}
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.skip }}
      - run: pnpm test typecheck --ci --base ${{ matrix.base }}
        if: ${{ !inputs.skip }}
      - name: Hand the record to PR Summary
        id: record
        if: ${{ always() && !inputs.skip }}
        run: node tools/release/record-output.mjs --key ${{ matrix.base }} >> "$GITHUB_OUTPUT"
